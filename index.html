<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vinyl — Explore sua música</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    /* Estilos específicos para as setas de navegação da vitrine no index */
    .vitrine-container {
        position: relative;
        display: flex;
        align-items: center;
    }
    .btn-scroll {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(30, 27, 46, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
        transition: 0.3s;
    }
    .btn-scroll:hover {
        background: var(--accent);
    }
    .btn-left { left: -20px; }
    .btn-right { right: -20px; }
    
    /* Ajuste para não quebrar o layout mobile */
    @media (max-width: 768px) {
        .btn-scroll { display: none; }
    }
  </style>
</head>
<body class="app-body">

  <nav class="navbar-custom">
    <span class="nav-logo">◉ Vinyl</span>
    <div style="display:flex; gap:15px; align-items:center;">
      <a href="login.html" class="nav-item">Entrar</a>
      <a href="login.html#cadastro" class="btn-primary" style="padding: 8px 20px; font-size: 0.85rem;">Criar conta</a>
    </div>
  </nav>

  <main class="container mt-5">
    <div class="mb-5">
        <h1 style="font-weight: 800;">Seu diário musical. 🎵</h1>
        <p style="color: var(--text-muted);">Avalie álbuns, descubra tendências e partilhe os seus sons favoritos.</p>
    </div>

    <h3 class="section-title">Destaques da Comunidade</h3>
    
    <div class="vitrine-container">
        <button class="btn-scroll btn-left" onclick="scrollVitrine('vitrine-publica', -300)">❮</button>
        <div id="vitrine-publica">
            <!-- Cards carregados via JS -->
        </div>
        <button class="btn-scroll btn-right" onclick="scrollVitrine('vitrine-publica', 300)">❯</button>
    </div>

    <h3 class="section-title mt-5">Atividade Recente</h3>
    <div id="feed-reviews-global">
        <!-- Reviews carregadas via JS -->
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/main.js"></script>
</body>
</html>
