<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MusicBox — Favoritos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="app-body">

  <nav class="navbar-custom">
    <span class="nav-logo">🎵 MusicBox</span>
    <div class="nav-links">
      <a href="../app.html"    class="nav-item"        title="Início">🏠</a>
      <a href="explorar.html"  class="nav-item"        title="Explorar">🔍</a>
      <a href="busca.html"     class="nav-item"        title="Busca">🎶</a>
      <a href="favoritos.html" class="nav-item active" title="Favoritos">❤️</a>
      <a href="perfil.html"    class="nav-item"        title="Perfil">👤</a>
    </div>
  </nav>

  <main class="app-main">
    <h2 class="greeting-title mb-1">Favoritos ❤️</h2>
    <p class="greeting-sub mb-4">Suas músicas preferidas em um só lugar</p>

    <div class="review-card">
      <div class="review-header">
        <div class="music-cover" style="background:#DB023D;width:52px;height:52px;font-size:1.4rem;flex-shrink:0">🎸</div>
        <div style="flex:1">
          <p class="music-title" style="font-size:0.95rem">Bohemian Rhapsody</p>
          <p class="music-artist">Queen</p>
        </div>
        <button class="btn-fav">❤️</button>
      </div>
    </div>

    <div class="review-card">
      <div class="review-header">
        <div class="music-cover" style="background:#FF6347;width:52px;height:52px;font-size:1.4rem;flex-shrink:0">🎹</div>
        <div style="flex:1">
          <p class="music-title" style="font-size:0.95rem">Blinding Lights</p>
          <p class="music-artist">The Weeknd</p>
        </div>
        <button class="btn-fav">❤️</button>
      </div>
    </div>

    <div class="review-card">
      <div class="review-header">
        <div class="music-cover" style="background:#c47a00;width:52px;height:52px;font-size:1.4rem;flex-shrink:0">👑</div>
        <div style="flex:1">
          <p class="music-title" style="font-size:0.95rem">Renaissance</p>
          <p class="music-artist">Beyoncé</p>
        </div>
        <button class="btn-fav">❤️</button>
      </div>
    </div>

  </main>

  <script src="../js/main.js"></script>
</body>
</html>
