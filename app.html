<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MusicBox — Início</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="app-body">

  <nav class="navbar-custom">
    <span class="nav-logo">◉ Vinyl</span>
    <div class="nav-links">
      <a href="pages/explorar.html" class="nav-item">🔥 Explorar</a>
      <a href="pages/busca.html"    class="nav-item">🔍 Buscar</a>
      <a href="pages/favoritos.html"class="nav-item">❤️ Favoritos</a>
      <a href="pages/perfil.html"   class="nav-item">👤 Perfil</a>
      <a href="javascript:logout()" class="nav-item">🚪 Sair</a>
    </div>
  </nav>

  <main class="app-main">

    <div class="section-header">
      <h2 id="nome-usuario">Bem-vindo!</h2>
      <p>Descubra e avalie sua música favorita hoje.</p>
    </div>

    <h3 class="section-title">Populares no Vinyl</h3>
<div id="vitrine-musicas" class="row"></div>


<div class="row justify-content-center mt-5">
    <div class="col-12 col-lg-10">
        <h3 class="section-title mb-4">Artistas para Explorar</h3>
<div id="lista-artistas" class="d-flex flex-wrap justify-content-center gap-4">
    </div>

    </div>
</div>

  </main>
<div class="fab-container">
  <div class="fab-options" id="fab-options">
    <button class="fab-item" onclick="prepararModalPlaylist()" title="Nova Playlist">
      <span class="fab-label">Nova Playlist</span>
      <span class="fab-icon">🎵</span>
    </button>
    <button class="fab-item" onclick="prepararModalReview()" title="Nova Review">
      <span class="fab-label">Nova Review</span>
      <span class="fab-icon">⭐</span>
    </button>
  </div>
  <button class="fab-main" onclick="toggleFab()" id="fab-main">
    <span>+</span>
  </button>
</div>
</button>


   

  <!-- Botão Flutuante para Review -->
  <button class="fab-button" onclick="prepararModalReview()" title="Nova Review">+</button>

  <!-- MODAL DE REVIEW -->

      <div class="modal-overlay" id="modal-overlay" style="display:none">
    <div class="modal-box">
        <div class="modal-header">
            <h5>Avaliar Música</h5>
            <button onclick="fecharModal()">✕</button>
        </div>
        
        <div style="position:relative;">
            <input type="text" id="rev-musica" class="custom-input mb-2" 
                   placeholder="Digite o nome da música..." oninput="buscarSugestoesReview()">
            <div id="sugestoes-review" class="sugestoes-box" 
                 style="display:none; position:absolute; width:100%; z-index:9999; background:#2a2540; border:1px solid #e81856; border-radius:8px;">
            </div>
        </div>

        <input type="text" id="rev-artista" class="custom-input mb-3" placeholder="Artista" readonly style="background: rgba(255,255,255,0.05); color: gray;">
        
        <div class="stars-rating mb-3">
            <span class="star" onclick="selecionarEstrelas(1)">★</span>
            <span class="star" onclick="selecionarEstrelas(2)">★</span>
            <span class="star" onclick="selecionarEstrelas(3)">★</span>
            <span class="star" onclick="selecionarEstrelas(4)">★</span>
            <span class="star" onclick="selecionarEstrelas(5)">★</span>
        </div>
        <textarea id="rev-texto" class="custom-input mb-3" placeholder="O que achaste deste som?"></textarea>
        <button class="btn-primary w-100" onclick="salvarReview()">Publicar Review</button>
    </div>
</div>

<div class="modal-overlay" id="modal-playlist" style="display:none">
    <div class="modal-box">
        <div class="modal-header">
            <h5>Criar Nova Playlist</h5>
            <button onclick="fecharModalPlaylist()">✕</button>
        </div>
        <input type="text" id="play-nome" class="custom-input mb-3" placeholder="Nome da minha playlist">
        
        <div style="position:relative;">
            <input type="text" id="busca-musica-playlist" class="custom-input mb-2" 
                   placeholder="Pesquisar música..." oninput="buscarMusicasParaPlaylist()">
            <div id="sugestoes-playlist" class="sugestoes-box" style="display:none; background:#2a2540; border:1px solid #e81856;"></div>
        </div>

        <div id="lista-musicas-selecionadas" class="mb-3 mt-2" style="min-height:50px; border:1px dashed #444; padding:10px;">
            </div>
        <button class="btn-primary w-100" onclick="salvarPlaylist()">Publicar Playlist</button>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/main.js"></script>

</div>
</body>
</html>
