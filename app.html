<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MusicBox — Início</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="app-body">

  <nav class="navbar-custom">
    <span class="nav-logo">◉ Vinyl</span>
    <div class="nav-links">
      <a href="pages/explorar.html" class="nav-item">🔥 Explorar</a>
      <a href="pages/busca.html"    class="nav-item">🔍 Buscar</a>
      <a href="pages/favoritos.html"class="nav-item">❤️ Favoritos</a>
      <a href="pages/perfil.html"   class="nav-item">👤 Perfil</a>
      <a href="javascript:logout()" class="nav-item">🚪 Sair</a>
    </div>
  </nav>

  <main class="app-main">

    <div class="section-header">
      <h2 id="nome-usuario">Bem-vindo!</h2>
      <p>Descubra e avalie sua música favorita hoje.</p>
    </div>

    <h3 class="section-title">Populares no Vinyl</h3>
    <div class="music-grid" id="vitrine-musicas">
        </div>

  </main>

  <div class="modal-overlay" id="modal-overlay" style="display:none">
    <div class="modal-box" id="conteudo-review">
      <div class="modal-header">
        <h5>Avaliar Música ⭐️</h5>
        <button class="modal-close" onclick="fecharModal()">✕</button>
      </div>
      
      <input type="hidden" id="rev-musica">
      <input type="hidden" id="rev-artista">
      <input type="hidden" id="rev-link">

      <div class="stars-rating mb-3">
        <span class="star" onclick="selecionarEstrelas(1)">★</span>
        <span class="star" onclick="selecionarEstrelas(2)">★</span>
        <span class="star" onclick="selecionarEstrelas(3)">★</span>
        <span class="star" onclick="selecionarEstrelas(4)">★</span>
        <span class="star" onclick="selecionarEstrelas(5)">★</span>
      </div>

   <main class="container mt-5">
  <div class="row" id="vitrine-musicas">
    <p id="mensagem-status" style="color: white;">Aguardando sistema...</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/main.js"></script>

</div>
</body>
</html>
