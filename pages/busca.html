<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MusicBox — Busca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="app-body">

  <nav class="navbar-custom">
    <a href="../app.html" class="nav-logo">◉ Vinyl</a>
    <div class="nav-links">
      <a href="explorar.html"  class="nav-item">🔥 Explorar</a>
      <a href="busca.html"     class="nav-item active" style="color:var(--btn)">🔍 Buscar</a>
      <a href="favoritos.html" class="nav-item">❤️ Favoritos</a>
      <a href="perfil.html"    class="nav-item">👤 Perfil</a>
      <a href="javascript:logout()" class="nav-item">🚪 Sair</a>
    </div>
  </nav>

  <main class="app-main">
    <div class="section-header">
      <h2>🔍 Buscar</h2>
      <p>Encontre suas músicas favoritas.</p>
    </div>

    <!-- Campo de busca -->
    <div class="busca-wrapper mb-5">
      <input type="text" id="campo-busca" class="custom-input busca-input"
        placeholder="Digite uma música ou artista..." oninput="buscar()"/>
      <span class="busca-icon">🔍</span>
    </div>

    <!-- Resultados -->
   <div id="resultados"></div>

    <div id="estado-vazio" class="text-center mt-5">
      <p style="color:var(--text-muted)">Digite algo para começar a explorar...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/main.js"></script> 
  <script src="../js/busca.js"></script>
</body>
</html>
