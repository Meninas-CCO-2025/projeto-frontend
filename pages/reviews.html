<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vinyl — Todas as Reviews</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/reviews.css"/>
</head>
<body class="app-body">

  <nav class="navbar-custom">
    <a href="../app.html" class="nav-logo">◉ Vinyl</a>
    <div class="nav-links">
      <a href="explorar.html"  class="nav-item">🔥 Explorar</a>

      <a href="javascript:logout()" class="nav-item">🚪 Sair</a>

 <main class="app-main">
    <div class="section-header">
      <h2>💬 Todas as Reviews</h2>
      <p>Veja o que a comunidade está achando e filtre como quiser.</p>
    </div>

    <div class="mb-4">
      <!-- Executa pesquisa enquanto o usuário digita -->
       <input type="text" id="filtro-reviews" class="form-control custom-input" placeholder="Filtrar por música, artista ou usuário..." onkeyup="filtrarReviews()">
    </div>

    <!-- JS renderiza as reviews -->
    <div id="lista-todas-reviews"></div> 
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
