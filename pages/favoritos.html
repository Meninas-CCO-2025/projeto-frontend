<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MusicBox — Favoritos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="app-body">

  <nav class="navbar-custom">
    <a href="../app.html" class="nav-logo">◉ Vinyl</a>
    <div class="nav-links">

      <a href="explorar.html"  class="nav-item">🔥 Explorar</a>
      <a href="busca.html"     class="nav-item">🔍 Buscar</a>
      <a href="favoritos.html" class="nav-item active" style="color:var(--btn)">❤️ Favoritos</a>
      <a href="perfil.html"    class="nav-item">👤 Perfil</a>
      <a href="javascript:logout()" class="nav-item">🚪 Sair</a>
    </div>
  </nav>

  <main class="app-main">
    <div class="section-header">
      <h2>❤️ Favoritos</h2>
      <p>Suas músicas preferidas em um só lugar</p>
    </div>

    <div class="review-card">
      <div class="review-header">
        <div class="music-cover" style="background:#DB023D;width:52px;height:52px;font-size:1.4rem;flex-shrink:0">🎸</div>
        <div style="flex:1">
          <p class="music-title" style="font-size:0.95rem">Bohemian Rhapsody</p>
          <p class="music-artist">Queen</p>
        </div>
        <button class="btn-fav">❤️</button>
      </div>
    </div>

    <div class="review-card">
      <div class="review-header">
        <div class="music-cover" style="background:#FF6347;width:52px;height:52px;font-size:1.4rem;flex-shrink:0">🎹</div>
        <div style="flex:1">
          <p class="music-title" style="font-size:0.95rem">Blinding Lights</p>
          <p class="music-artist">The Weeknd</p>
        </div>
        <button class="btn-fav">❤️</button>
      </div>
    </div>

    <div class="review-card">
      <div class="review-header">
        <div class="music-cover" style="background:#c47a00;width:52px;height:52px;font-size:1.4rem;flex-shrink:0">👑</div>
        <div style="flex:1">
          <p class="music-title" style="font-size:0.95rem">Renaissance</p>
          <p class="music-artist">Beyoncé</p>
        </div>
        <button class="btn-fav">❤️</button>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
