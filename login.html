<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MusicBox</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <div class="auth-wrapper">

    <!-- Logo -->
    <div class="text-center mb-4">
      <h1 class="logo">◉ Vinyl</h1>
      <p class="text-muted-custom">Descubra e avalie sua música</p>
    </div>

    <!-- Card principal -->
    <div class="auth-card">

      <!-- Abas -->
      <div class="tab-switcher mb-4">
        <button type="button" class="tab-btn active" id="tab-cadastro" onclick="showTab('cadastro')">Cadastrar</button>
        <button type="button" class="tab-btn" id="tab-login" onclick="showTab('login')">Entrar</button>
      </div>

      <!-- FORMULÁRIO CADASTRO -->
      <div id="form-cadastro">
        <div class="mb-3">
          <label class="form-label">Nome de usuário</label>
          <input type="text" id="cad-nome" class="form-control custom-input" placeholder="@seunome"/>
        </div>
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" id="cad-email" class="form-control custom-input" placeholder="email@exemplo.com"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" id="cad-senha" class="form-control custom-input" placeholder="Mínimo 6 caracteres"/>
        </div>
        <div class="mb-4">
          <label class="form-label">Data de nascimento</label>
          <input type="date" id="cad-data" class="form-control custom-input"/>
        </div>
      <button type="button" class="btn btn-primary w-100 mb-3" onclick="cadastrar()">Criar conta</button>
        <div class="divider"><span>ou</span></div>
        <button type="button" class="btn btn-google w-100 mt-3" onclick="loginGoogle()">
          <img src="https://www.google.com/favicon.ico" width="18" style="margin-right:8px"/>
          Continuar com Google
        </button>
        <p id="erro-cadastro" class="erro-msg mt-2"></p>
      </div>

      <!-- FORMULÁRIO LOGIN -->
      <div id="form-login" style="display:none">
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" id="login-email" class="form-control custom-input" placeholder="email@exemplo.com"/>
        </div>
        <div class="mb-4">
          <label class="form-label">Senha</label>
          <input type="password" id="login-senha" class="form-control custom-input" placeholder="Sua senha"/>
        </div>
        <button type="button" class="btn btn-primary w-100 mb-3" onclick="login()">Entrar</button>
        <div class="divider"><span>ou</span></div>
        <button type="button" class="btn btn-google w-100 mt-3" onclick="loginGoogle()">
          <img src="https://www.google.com/favicon.ico" width="18" style="margin-right:8px"/>
          Continuar com Google
        </button>
        <p id="erro-login" class="erro-msg mt-2"></p>
      </div>

    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/main.js"></script>

</body>
</html>
